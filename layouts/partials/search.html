<div class="search search--dark">
  <div class="main">
    <div class="search__header">Search</div>
    <div class="search-bar">
      <div class="search-box js-search-box">
        <div class="search-box__icon-search"><i class="fas fa-search"></i></div>
        <input type="text" />
        <div class="search-box__icon-clear js-icon-clear">
          <a><i class="fas fa-times"></i></a>
        </div>
      </div>
      <button class="button button--theme-dark button--pill search__cancel js-search-toggle">
        Cancel</button>
    </div>
    <div class="search-result js-search-result"></div>
  </div>
</div>
<script>
{{- $postList := slice -}}
{{- range where .Site.RegularPages "Section" "posts" -}}
  {{- $cleanTitle := .Title | strings.TrimPrefix "\"" | strings.TrimSuffix "\"" | strings.TrimSpace -}}
  {{- $postList = $postList | append (dict "title" $cleanTitle "url" .RelPermalink) -}}
{{- end -}}
window.TEXT_SEARCH_DATA = {{ dict "posts" $postList | jsonify | safeJS }};
</script>
<script src="{{ "/assets/javascripts/search-bundle.js" | relURL }}"></script>
