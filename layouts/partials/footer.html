<footer class="footer py-4 js-page-footer">
  <div class="main">
    <div itemscope itemtype="http://schema.org/Person">
      <meta itemprop="name" content="{{ .Site.Params.author.name }}">
      <meta itemprop="url" content="{{ "/" | relURL }}">
      <meta itemprop="description" content="{{ .Site.Params.author.bio }}">
      <div class="footer__author-links">
        {{ partial "author-links.html" . }}
      </div>
    </div>
    <div class="site-info mt-2">
      <div>
        © {{ .Site.Title }} 2019 - {{ now.Year }},
        Powered by <a title="Hugo is the world’s fastest framework for building websites." href="https://gohugo.io/" target="_blank">Hugo</a> & <a title="TeXt is a super customizable blog theme." href="https://github.com/kitian616/jekyll-TeXt-theme" target="_blank">TeXt Theme</a>.
      </div>
    </div>
  </div>
</footer>
